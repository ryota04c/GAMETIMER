<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>大富豪タイマー</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game-container">
    <section class="setting">

        <h2>ゲーム設定</h2>
    
        <label>
            ゲーム
            <select id="presetSelect">
                <option value="daifugo">大富豪</option>
                <option value="uno">UNO</option>
                <option value="catan">カタン</option>
            </select>
        </label>
    
        <label>
            準備時間
            <input
                type="number"
                id="prepareInput"
                value="10"
                min="0"
                step="0.001">
            秒
        </label>
    
        <label>
            持ち時間
            <input
                type="number"
                id="timeInput"
                value="30"
                min="1"
                step="0.001">
            秒
        </label>
    
        <label>
            プレイヤー数
            <input
                type="number"
                id="playerInput"
                value="4"
                min="2"
                max="8">
        </label>
    
    </section>
    <!-- 中央準備タイマー -->
    <section class="center-area">

        <h2>準備時間</h2>

        <div id="centerTimer" class="center-timer">
            30.000
        </div>

    </section>


    <!-- プレイヤーエリア -->

    <section class="players">


        <div class="player" id="player0">

            <h2>Player 1</h2>

            <div class="timer">
                30.000
            </div>

            <button class="finish-btn">
                終了
            </button>

        </div>



        <div class="player" id="player1">

            <h2>Player 2</h2>

            <div class="timer">
                30.000
            </div>

            <button class="finish-btn">
                終了
            </button>

        </div>



        <div class="player" id="player2">

            <h2>Player 3</h2>

            <div class="timer">
                30.000
            </div>

            <button class="finish-btn">
                終了
            </button>

        </div>



        <div class="player" id="player3">

            <h2>Player 4</h2>

            <div class="timer">
                30.000
            </div>

            <button class="finish-btn">
                終了
            </button>

        </div>


    </section>



    <!-- 操作ボタン -->

    <section class="control">

        <button id="start">
            開始
        </button>

        <button id="pause">
            一時停止
        </button>

        <button id="reset">
            リセット
        </button>

    </section>


</div>


<script src="classes/Timer.js"></script>
<script src="classes/Player.js"></script>
<script src="classes/GameManager.js"></script>
<script src="script.js"></script>

</body>
</html>
