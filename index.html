<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Board Timer</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div id="app">


    <!-- 中央表示 -->

    <div id="center">

        <div id="centerText">
            準備時間
        </div>

        <div id="centerTimer">
            10.000
        </div>

    </div>



    <!-- 座席エリア -->

    <div id="board">


        <div class="seat seat-top">

            <div class="name">
                Player1
            </div>

            <div class="time">
                30.000
            </div>

            <button>
                終了
            </button>

        </div>



        <div class="seat seat-right">

            <div class="name">
                Player2
            </div>

            <div class="time">
                30.000
            </div>

            <button>
                終了
            </button>

        </div>



        <div class="seat seat-bottom">

            <div class="name">
                Player3
            </div>

            <div class="time">
                30.000
            </div>

            <button>
                終了
            </button>

        </div>



        <div class="seat seat-left">

            <div class="name">
                Player4
            </div>

            <div class="time">
                30.000
            </div>

            <button>
                終了
            </button>

        </div>



    </div>


</div>


<script src="script.js"></script>

</body>

</html>
