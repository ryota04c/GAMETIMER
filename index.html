<!DOCTYPE html>
<html lang="ja">

<head>

    
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Board Timer</title>

<link rel="stylesheet" href="style.css">

</head>


<body>
<div id="settingScreen">

    <div id="settingBoard">


        <!-- 名前入力座席を生成 -->

    </div>


    <div id="settingCenter">


        <h1>
            大富豪タイマー
        </h1>


        <label>

            人数

            <select id="playerCount">

                <option value="2">2人</option>
                <option value="3">3人</option>
                <option value="4" selected>4人</option>
                <option value="5">5人</option>
                <option value="6">6人</option>
                <option value="7">7人</option>
                <option value="8">8人</option>

            </select>

        </label>


        <br>


        <label>

            準備時間

            <input id="prepareTime"
                   value="10">

        </label>


        <br>


        <label>

            持ち時間

            <input id="playerTime"
                   value="30">

        </label>


        <br>


        <button id="startGame">

            ゲーム開始

        </button>


    </div>


</div>

<div id="timerScreen">


    <div id="board"></div>


    <div id="center">

        <div id="centerText">
            準備時間
        </div>

        <div id="centerTimer">
            10.000
        </div>
        <button id="pauseButton">
        
            PAUSE
        
        </button>
    </div>


</div>


<script src="script.js"></script>

</body>

</html>
